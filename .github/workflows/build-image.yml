name: build-image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pi/image/**"
      - "pi/wifi-connect-release.sh"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Pi OS suite (bookworm recommended for Zero W)
        default: bookworm
        type: choice
        options:
          - bookworm
          - trixie

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image stage smoke test
        run: bash pi/image/test-local.sh

  lucy-zero-w-armhf:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/share/miniconda /opt/az /opt/microsoft \
            /usr/lib/google-cloud-sdk /usr/local/share/chromium /usr/local/julia* || true
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Set up QEMU (armhf on x86_64 runner)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Symlink qemu-arm-static for pi-gen container binfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo ln -sf /usr/bin/qemu-arm-static /usr/local/bin/qemu-arm
          command -v qemu-arm
          ls -la /usr/local/bin/qemu-arm /usr/bin/qemu-arm-static

      - name: Build Lucy OS image (Pi Zero W / armhf)
        id: pigen
        uses: usimd/pi-gen-action@v1
        env:
          LUCY_SRC: ${{ github.workspace }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          image-name: lucy-zero-w
          pi-gen-version: bookworm
          pi-gen-release: Lucy Ghost Zero
          release: ${{ inputs.release || 'bookworm' }}
          hostname: lucy-zero
          username: pi
          enable-ssh: 1
          enable-cloud-init: 1
          export-last-stage-only: true
          increase-runner-disk-size: false
          compression: xz
          compression-level: 6
          verbose-output: true
          stage-list: stage0 stage1 stage2 pi/image/stage-lucy
          docker-opts: >-
            -v ${{ github.workspace }}:${{ github.workspace }}:ro
            -e LUCY_SRC=${{ github.workspace }}
            -e GITHUB_WORKSPACE=${{ github.workspace }}
            -e LUCY_IMAGE_ENGINE=live_http

      - name: Upload artifact (workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lucy-zero-w-armhf
          path: ${{ steps.pigen.outputs.image-path }}
          retention-days: 14

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pigen.outputs.image-path }}
          generate_release_notes: true
